<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 绩点盲盒抽奖</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* 头部 */
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 30px 20px;
            background: linear-gradient(135deg, rgba(255,107,107,0.2) 0%, rgba(238,90,90,0.2) 100%);
            border-radius: 24px;
            border: 2px solid rgba(255,107,107,0.4);
        }
        header h1 { 
            font-size: 36px; 
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header p { 
            opacity: 0.8; 
            font-size: 16px;
        }
        
        /* 用户信息卡片 */
        .user-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.9) 100%);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        .user-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .gpa-display {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        .gpa-item {
            text-align: center;
        }
        .gpa-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }
        .gpa-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        
        /* 盲盒区域 */
        .blindbox-section {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.9) 100%);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .blindbox-title {
            text-align: center;
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }
        
        /* 盲盒样式 */
        .blindbox-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .blindbox {
            width: 150px;
            height: 180px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(255,107,107,0.4);
            border: 3px solid rgba(255,255,255,0.3);
            position: relative;
            overflow: hidden;
        }
        .blindbox:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255,107,107,0.6);
        }
        .blindbox.shaking {
            animation: shake 0.5s ease-in-out infinite;
        }
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }
        .blindbox-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }
        .blindbox-cost {
            font-size: 18px;
            font-weight: bold;
            color: white;
        }
        .blindbox-name {
            font-size: 14px;
            color: rgba(255,255,255,0.9);
            margin-top: 5px;
        }
        
        /* 抽奖按钮 */
        .draw-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            padding: 18px 40px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(255,107,107,0.4);
        }
        .draw-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255,107,107,0.6);
        }
        .draw-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        /* 奖品展示 */
        .prize-display {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, rgba(255,215,0,0.1) 0%, rgba(255,140,0,0.1) 100%);
            border-radius: 20px;
            margin-top: 20px;
            display: none;
        }
        .prize-display.show {
            display: block;
            animation: prizePop 0.5s ease-out;
        }
        @keyframes prizePop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .prize-icon {
            font-size: 80px;
            margin-bottom: 15px;
        }
        .prize-name {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .prize-desc {
            font-size: 16px;
            color: #666;
        }
        
        /* 奖品列表 */
        .prizes-section {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.9) 100%);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .prizes-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .prizes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .prize-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .prize-item:hover {
            transform: translateY(-5px);
            border-color: #ff6b6b;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .prize-item-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .prize-item-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .prize-item-prob {
            font-size: 12px;
            color: #ff6b6b;
        }
        
        /* 抽奖记录 */
        .history-section {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.9) 100%);
            border-radius: 20px;
            padding: 25px;
        }
        .history-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .history-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .history-prize {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .history-time {
            font-size: 12px;
            color: #999;
        }
        
        /* 返回按钮 */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 25px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateX(-5px);
        }
        
        /* 提示信息 */
        .alert {
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }
        .alert.show { display: block; }
        .alert-error {
            background: linear-gradient(135deg, #f8d7da, #f5c6cb);
            color: #721c24;
        }
        .alert-success {
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            color: #155724;
        }
        
        /* 登录弹窗 */
        .login-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-modal.hidden { display: none; }
        .login-content {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .login-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        .login-content h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }
        .login-content p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .login-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 15px;
            text-align: center;
        }
        .login-input:focus {
            outline: none;
            border-color: #ff6b6b;
        }
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* 彩带动画 */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff6b6b;
            position: absolute;
            animation: confetti-fall 3s ease-out forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- 登录弹窗 -->
    <div id="loginModal" class="login-modal">
        <div class="login-content">
            <div class="login-icon">🎁</div>
            <h2>绩点盲盒抽奖</h2>
            <p>请输入您的精网号登录</p>
            <input type="text" id="loginId" class="login-input" placeholder="请输入精网号(900开头)">
            <button class="login-btn" onclick="doLogin()">登录</button>
        </div>
    </div>

    <div class="container" id="mainContainer" style="display: none;">
        <a href="/" class="back-btn">← 返回排行榜</a>
        
        <header>
            <h1>🎁 绩点盲盒抽奖</h1>
            <p>消耗绩点，抽取惊喜好礼！</p>
        </header>
        
        <!-- 提示信息 -->
        <div id="alertBox" class="alert"></div>
        
        <!-- 用户信息 -->
        <div class="user-card">
            <h3>👤 <span id="userName">--</span></h3>
            <div class="gpa-display">
                <div class="gpa-item">
                    <div class="gpa-value" id="totalGpa">--</div>
                    <div class="gpa-label">总绩点</div>
                </div>
                <div class="gpa-item">
                    <div class="gpa-value" id="remainingGpa" style="color: #27ae60;">--</div>
                    <div class="gpa-label">剩余绩点</div>
                </div>
            </div>
        </div>
        
        <!-- 盲盒抽奖 -->
        <div class="blindbox-section">
            <h2 class="blindbox-title">🎲 选择盲盒</h2>
            
            <div class="blindbox-container">
                <div class="blindbox" onclick="drawBox('basic')">
                    <div class="blindbox-icon">📦</div>
                    <div class="blindbox-cost">10 绩点</div>
                    <div class="blindbox-name">普通盲盒</div>
                </div>
                <div class="blindbox" onclick="drawBox('premium')" style="background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);">
                    <div class="blindbox-icon">🎁</div>
                    <div class="blindbox-cost">30 绩点</div>
                    <div class="blindbox-name">高级盲盒</div>
                </div>
                <div class="blindbox" onclick="drawBox('legendary')" style="background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);">
                    <div class="blindbox-icon">👑</div>
                    <div class="blindbox-cost">50 绩点</div>
                    <div class="blindbox-name">传说盲盒</div>
                </div>
            </div>
            
            <!-- 奖品展示 -->
            <div id="prizeDisplay" class="prize-display">
                <div class="prize-icon" id="prizeIcon">🎉</div>
                <div class="prize-name" id="prizeName">--</div>
                <div class="prize-desc" id="prizeDesc">--</div>
            </div>
        </div>
        
        <!-- 奖品列表 -->
        <div class="prizes-section">
            <h3 class="prizes-title">🏆 奖品一览</h3>
            <div class="prizes-grid">
                <div class="prize-item">
                    <div class="prize-item-icon">🤖</div>
                    <div class="prize-item-name">AI预测大模型</div>
                    <div class="prize-item-prob">3天使用权</div>
                </div>
                <div class="prize-item">
                    <div class="prize-item-icon">☁️</div>
                    <div class="prize-item-name">云脑系统</div>
                    <div class="prize-item-prob">3天使用权</div>
                </div>
                <div class="prize-item">
                    <div class="prize-item-icon">⚔️</div>
                    <div class="prize-item-name">利剑系统</div>
                    <div class="prize-item-prob">3天使用权</div>
                </div>
                <div class="prize-item">
                    <div class="prize-item-icon">📊</div>
                    <div class="prize-item-name">K线复盘报告</div>
                    <div class="prize-item-prob">1份</div>
                </div>
                <div class="prize-item">
                    <div class="prize-item-icon">💎</div>
                    <div class="prize-item-name">额外绩点</div>
                    <div class="prize-item-prob">+5~20绩点</div>
                </div>
                <div class="prize-item">
                    <div class="prize-item-icon">🍀</div>
                    <div class="prize-item-name">谢谢参与</div>
                    <div class="prize-item-prob">再接再厉</div>
                </div>
            </div>
        </div>
        
        <!-- 抽奖记录 -->
        <div class="history-section">
            <h3 class="history-title">📜 我的抽奖记录</h3>
            <div class="history-list" id="historyList">
                <div style="text-align: center; color: #999; padding: 20px;">暂无记录</div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let userData = null;
        
        // 奖品配置
        const prizes = {
            basic: [
                { icon: '🤖', name: 'AI预测大模型(1天)', desc: '获得AI预测大模型1天使用权', value: 'ai_1d', weight: 20 },
                { icon: '☁️', name: '云脑系统(1天)', desc: '获得云脑系统1天使用权', value: 'cloud_1d', weight: 20 },
                { icon: '⚔️', name: '利剑系统(1天)', desc: '获得利剑系统1天使用权', value: 'sword_1d', weight: 20 },
                { icon: '💎', name: '+5绩点', desc: '额外获得5绩点', value: 'gpa_5', weight: 15 },
                { icon: '🍀', name: '谢谢参与', desc: '很遗憾，这次没有中奖', value: 'none', weight: 25 }
            ],
            premium: [
                { icon: '🤖', name: 'AI预测大模型(3天)', desc: '获得AI预测大模型3天使用权', value: 'ai_3d', weight: 25 },
                { icon: '☁️', name: '云脑系统(3天)', desc: '获得云脑系统3天使用权', value: 'cloud_3d', weight: 25 },
                { icon: '⚔️', name: '利剑系统(3天)', desc: '获得利剑系统3天使用权', value: 'sword_3d', weight: 20 },
                { icon: '📊', name: 'K线复盘报告', desc: '获得AI赢家K线复盘报告1份', value: 'report', weight: 15 },
                { icon: '💎', name: '+10绩点', desc: '额外获得10绩点', value: 'gpa_10', weight: 10 },
                { icon: '🍀', name: '谢谢参与', desc: '很遗憾，这次没有中奖', value: 'none', weight: 5 }
            ],
            legendary: [
                { icon: '🤖', name: 'AI预测大模型(7天)', desc: '获得AI预测大模型7天使用权', value: 'ai_7d', weight: 25 },
                { icon: '☁️', name: '云脑系统(7天)', desc: '获得云脑系统7天使用权', value: 'cloud_7d', weight: 25 },
                { icon: '⚔️', name: '利剑系统(7天)', desc: '获得利剑系统7天使用权', value: 'sword_7d', weight: 20 },
                { icon: '📊', name: 'K线复盘报告×2', desc: '获得AI赢家K线复盘报告2份', value: 'report_2', weight: 15 },
                { icon: '💎', name: '+20绩点', desc: '额外获得20绩点', value: 'gpa_20', weight: 10 },
                { icon: '🎁', name: '神秘大奖', desc: '获得神秘大奖一份', value: 'mystery', weight: 5 }
            ]
        };
        
        const boxCosts = {
            basic: 10,
            premium: 30,
            legendary: 50
        };
        
        // 登录
        async function doLogin() {
            const loginId = document.getElementById('loginId').value.trim();
            if (!loginId) {
                showAlert('请输入精网号', 'error');
                return;
            }
            
            try {
                // 获取用户数据
                const res = await fetch('/api/gpa');
                const data = await res.json();
                
                let user = data.find(u => u.id === loginId || u.idMasked === loginId);
                if (!user) {
                    user = data.find(u => u.name.toLowerCase() === loginId.toLowerCase());
                }
                
                if (!user) {
                    showAlert('未找到该用户，请检查精网号', 'error');
                    return;
                }
                
                currentUser = { id: user.id, name: user.name };
                userData = user;
                
                // 保存登录状态
                localStorage.setItem('blindboxUser', JSON.stringify(currentUser));
                
                showMainContent();
            } catch (err) {
                console.error('登录失败:', err);
                showAlert('登录失败，请重试', 'error');
            }
        }
        
        // 显示主内容
        function showMainContent() {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('mainContainer').style.display = 'block';
            updateUserDisplay();
            loadHistory();
        }
        
        // 更新用户显示
        function updateUserDisplay() {
            if (!userData) return;
            
            document.getElementById('userName').textContent = userData.name;
            document.getElementById('totalGpa').textContent = userData.totalGpa;
            const remaining = userData.totalGpa - (userData.usedGpa || 0);
            document.getElementById('remainingGpa').textContent = remaining;
        }
        
        // 抽奖
        async function drawBox(boxType) {
            if (!currentUser) {
                showAlert('请先登录', 'error');
                return;
            }
            
            const cost = boxCosts[boxType];
            const remaining = userData.totalGpa - (userData.usedGpa || 0);
            
            if (remaining < cost) {
                showAlert(`绩点不足！需要${cost}绩点，您只有${remaining}绩点`, 'error');
                return;
            }
            
            // 添加摇晃动画
            const boxes = document.querySelectorAll('.blindbox');
            boxes.forEach(box => box.classList.add('shaking'));
            
            // 禁用按钮
            boxes.forEach(box => box.style.pointerEvents = 'none');
            
            try {
                // 调用API
                const res = await fetch('/api/blindbox/draw', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUser.id,
                        boxType: boxType,
                        cost: cost
                    })
                });
                
                const result = await res.json();
                
                if (!result.success) {
                    showAlert(result.message || '抽奖失败', 'error');
                    boxes.forEach(box => {
                        box.classList.remove('shaking');
                        box.style.pointerEvents = 'auto';
                    });
                    return;
                }
                
                // 停止动画
                setTimeout(() => {
                    boxes.forEach(box => {
                        box.classList.remove('shaking');
                        box.style.pointerEvents = 'auto';
                    });
                    
                    // 显示奖品
                    showPrize(result.prize);
                    
                    // 更新用户数据
                    userData.usedGpa = (userData.usedGpa || 0) + cost;
                    if (result.prize.value.startsWith('gpa_')) {
                        const bonus = parseInt(result.prize.value.split('_')[1]);
                        userData.totalGpa += bonus;
                    }
                    updateUserDisplay();
                    
                    // 添加记录
                    addHistory(result.prize, cost);
                    
                    // 彩带效果
                    createConfetti();
                    
                    showAlert(`恭喜！获得 ${result.prize.name}`, 'success');
                }, 2000);
                
            } catch (err) {
                console.error('抽奖失败:', err);
                boxes.forEach(box => {
                    box.classList.remove('shaking');
                    box.style.pointerEvents = 'auto';
                });
                showAlert('抽奖失败，请重试', 'error');
            }
        }
        
        // 显示奖品
        function showPrize(prize) {
            const display = document.getElementById('prizeDisplay');
            document.getElementById('prizeIcon').textContent = prize.icon;
            document.getElementById('prizeName').textContent = prize.name;
            document.getElementById('prizeDesc').textContent = prize.desc;
            display.classList.add('show');
        }
        
        // 添加历史记录
        function addHistory(prize, cost) {
            const list = document.getElementById('historyList');
            const time = new Date().toLocaleString('zh-CN');
            
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div class="history-prize">
                    <span style="font-size: 24px;">${prize.icon}</span>
                    <span>${prize.name}</span>
                </div>
                <div class="history-time">${time}</div>
            `;
            
            // 移除"暂无记录"
            if (list.children[0]?.textContent === '暂无记录') {
                list.innerHTML = '';
            }
            
            list.insertBefore(item, list.firstChild);
        }
        
        // 加载历史记录
        async function loadHistory() {
            if (!currentUser) return;
            
            try {
                const res = await fetch(`/api/blindbox/history?userId=${currentUser.id}`);
                const data = await res.json();
                
                const list = document.getElementById('historyList');
                if (data.length === 0) {
                    list.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">暂无记录</div>';
                    return;
                }
                
                list.innerHTML = data.map(item => `
                    <div class="history-item">
                        <div class="history-prize">
                            <span style="font-size: 24px;">${item.prizeIcon}</span>
                            <span>${item.prizeName}</span>
                        </div>
                        <div class="history-time">${new Date(item.timestamp).toLocaleString('zh-CN')}</div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('加载历史失败:', err);
            }
        }
        
        // 显示提示
        function showAlert(message, type) {
            const alert = document.getElementById('alertBox');
            alert.textContent = message;
            alert.className = `alert alert-${type} show`;
            setTimeout(() => alert.classList.remove('show'), 3000);
        }
        
        // 彩带效果
        function createConfetti() {
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3000);
            }
        }
        
        // 检查登录状态
        function checkLogin() {
            const saved = localStorage.getItem('blindboxUser');
            if (saved) {
                currentUser = JSON.parse(saved);
                // 重新获取用户数据
                fetch('/api/gpa')
                    .then(res => res.json())
                    .then(data => {
                        userData = data.find(u => u.id === currentUser.id);
                        if (userData) {
                            showMainContent();
                        } else {
                            localStorage.removeItem('blindboxUser');
                        }
                    });
            }
        }
        
        // 页面加载
        checkLogin();
        
        // 监听回车
        document.getElementById('loginId')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
